# Render Blueprint: one web service + one PostgreSQL database (pgvector is enabled by the app on first start).
services:
  - type: web
    name: repobloom
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --workers 2 --threads 4 --timeout 180 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: repobloom-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ACCESS_TOKEN      # read it in the Render dashboard, paste it into RepoBloom > Settings
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: REPO_ANALYST_MODEL
        sync: false
      - key: CONTEXT_ANALYST_MODEL
        sync: false
      - key: SYNTHESIZER_MODEL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
databases:
  - name: repobloom-db
    plan: basic-256mb
